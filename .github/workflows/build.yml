name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [main, master, pypi-packaging]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install package and test tools
        run: python -m pip install --upgrade pip build ".[test,qt6]"

      - name: Check console parsers
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          rsm_viewer --help
          rsm_monitor --help

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/unit

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*
