# EpiQ-Map monitor configuration (per beamtime).
#
# Precedence:  built-in defaults  <  this file  <  command-line flags
# So you can edit paths here once per beamtime, and still override any single
# value at launch, e.g.  rsm_monitor --interval 30
#
# Point the monitor at a different config with:  --config /path/to/file.toml
# Relative paths resolve from the directory containing this configuration file.

# --- Beamtime data locations (edit these each beamtime) ---
base_dir   = "/nfs/chess/id4b/2023-3/gregory-3864-a/raw6M/"
spec_dir   = "/nfs/chess/id4b/2023-3/gregory-3864-a/"
output_dir = "/nfs/chess/id4baux/2023-3/gregory-3864-a/processed/output/"
poni_file  = "/nfs/chess/id4baux/2023-3/gregory-3864-a/calibrations/CeO2_15keV.poni"
mask_file  = "/nfs/chess/id4baux/2023-3/gregory-3864-a/calibrations/mask.edf"

# --- Tools ---
# Interpreter that runs autoRSM. A bare name like "python" uses whatever is on
# PATH (the active environment) -- which often lacks the area-detector stack
# (fabio/pyFAI/spec2nexus) autoRSM needs, so conversions fail at import. Pin a
# full path to an interpreter that has the stack.
python  = "/nfs/chess/sw/miniconda_tfuchs/bin/python"
# The packaged autoRSM module is used by default. Uncomment only to select an
# external legacy script:
# autorsm = "/path/to/autoRSM.py"

# --- Behaviour ---
interval = 60                              # seconds between scans for new data
# Drop any frame whose peak (unmasked) intensity exceeds this from the
# reconstruction -- a detector overload otherwise smears a saturation halo
# across the map. Raise it to keep brighter frames.
max_intensity = 1e6
